syntax = "proto3";

package proto.v1;

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_POSITION_SAMPLE = 1;
  EVENT_TYPE_HEALTH_SAMPLE = 2;
  EVENT_TYPE_MISSION_UPDATE = 3;
}

enum MissionState {
  MISSION_STATE_UNSPECIFIED = 0;
  IDLE = 1;
  TAKEOFF = 2;
  PATROL = 3;
  RETURN_TO_HOME = 4;
  LANDED = 5;
}

enum MissionReason {
  MISSION_REASON_UNSPECIFIED = 0;
  STARTUP = 1;
  PATROL_STARTED = 2;
  LOW_BATTERY = 3;
  MANUAL_OVERRIDE = 4;
}

message PositionSample {
  double latitude_deg = 1;
  double longitude_deg = 2;
  double altitude_m = 3;
  double heading_deg = 4;
  double speed_mps = 5;
}

message HealthSample {
  uint32 battery_pct = 1;
  uint32 link_quality_pct = 2;
  uint32 gps_fix_type = 3;
}

message MissionUpdate {
  MissionState state = 1;
  MissionReason reason = 2;
}

message Payload {
  uint32 version = 1;

  oneof s_union {
    PositionSample position_sample = 2;
    HealthSample   health_sample   = 3;
    MissionUpdate  mission_update  = 4;
  }
}
