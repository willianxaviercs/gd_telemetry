syntax = "proto3";

package gundam.v1;

message TemperatureReading {
  double celsius = 1;
}

message StatusUpdate {
  string status = 1;
}

message DeviceEvent {
  int64 Id          = 1;
  int64 DeviceId    = 2;
  int64 Timestamp   = 3;
  EventType Type    = 4;

  oneof Payload {
    TemperatureReading TemperatureReading = 5;
    StatusUpdate       StatusUpdate       = 6;
  }
}
